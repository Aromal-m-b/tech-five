<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pentagonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d5b5" />
      <stop offset="35%" stop-color="#00b4d8" />
      <stop offset="70%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="fiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base optional glow -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="rgba(6, 182, 212, 0.08)" stroke-width="2" />

  <!-- Pentagon perimeter -->
  <polygon points="250,55 438,192 366,412 134,412 62,192"
    fill="none"
    stroke="url(#pentagonGrad)"
    stroke-width="18"
    stroke-linejoin="round" />

  <!-- Corner nodes -->
  <!-- Top Node -->
  <circle cx="250" cy="55" r="21" fill="#080d18" stroke="#00d5b5" stroke-width="9" />
  <!-- Top Right Node -->
  <circle cx="438" cy="192" r="21" fill="#080d18" stroke="#00b4d8" stroke-width="9" />
  <!-- Bottom Right Node -->
  <circle cx="366" cy="412" r="21" fill="#080d18" stroke="#2563eb" stroke-width="9" />
  <!-- Bottom Left Node -->
  <circle cx="134" cy="412" r="21" fill="#080d18" stroke="#00d5b5" stroke-width="9" />
  <!-- Top Left Node -->
  <circle cx="62" cy="192" r="21" fill="#080d18" stroke="#00e5c7" stroke-width="9" />

  <!-- Inner T and 5 Emblem -->
  <g id="t5-emblem" font-family="'Plus Jakarta Sans', 'Space Grotesk', system-ui, sans-serif" font-weight="900">
    <!-- Capital T -->
    <path d="M 155 160 H 345 V 195 H 270 V 338 H 230 V 195 H 155 Z"
      fill="#0ea5e9"
      stroke="#080d18"
      stroke-width="5"
      stroke-linejoin="round" />

    <!-- Number 5 overlapping with subtle outline for separation -->
    <path d="M 248 218 H 333 V 254 H 255 V 286 C 265 273 282 268 302 268 C 335 268 358 288 358 322 C 358 358 328 382 284 382 C 248 382 222 364 200 342 L 228 316 C 242 332 258 344 282 344 C 304 344 318 333 318 321 C 318 308 304 298 282 298 C 265 298 252 305 244 312 L 218 305 L 226 218 Z"
      fill="#3b82f6"
      stroke="#080d18"
      stroke-width="7"
      stroke-linejoin="round" />
  </g>
</svg>
